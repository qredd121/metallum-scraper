[project]
name = "metallum-scraper"
version = "0.1.0"
description = "Scraper building a structured dataset from Encyclopaedia Metallum"
readme = "README.md"
authors = [
    { name = "Timofei Shelestov", email = "tim.shelestov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.17.0",
    "loguru>=0.8.0",
    "polars>=2.1.0",
    "selectolax>=1.0.2",
    "typer>=0.29.1",
]

[project.scripts]
metallum = "metallum_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
